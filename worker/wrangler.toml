name = "prestarter"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Spec section 19's "one host or two" — resolved: the root domain is exclusively the Worker
# (playback + API), never a Pages project, since URL length only matters for what ends up on
# a printed poster (D6) — admin and portal each get their own subdomain as separate Pages
# projects instead (see ../admin/README.md, ../portal/README.md).
routes = [
  { pattern = "prestarter.au/*", zone_name = "prestarter.au" },
]

# Nightly billing-transition sweep (spec section 10). Test locally with:
#   curl "http://127.0.0.1:8787/__scheduled?cron=0+16+*+*+*"
[triggers]
crons = ["0 16 * * *"] # 02:00 AEST / 03:00 AEDT

# Bundles font files as raw binary (ArrayBuffer) — resvg-wasm has no system font access in
# the Workers runtime, so poster/QR PNG text rendering needs an explicit font buffer.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

